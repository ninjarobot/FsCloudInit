name: dotnet pack and publish

on:
  release:
    types: [released]
    branches: [ main ]

jobs:
  publish:
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: VERSION=${GITHUB_REF##*/} dotnet build -warnaserror --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
      - name: Pack
        run: VERSION=${GITHUB_REF##*/} dotnet pack -o . -c Release
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        run: dotnet nuget push FsCloudInit.*.nupkg -s https://nuget.org -k ${{steps.login.outputs.NUGET_API_KEY}}

